[package]
name = "veter"
description = "Service for communication between Jelka FMF components"
authors = ["Programerski klub FMF"]
repository = "https://github.com/Jelka-FMF/Veter"
license = "GPL-3.0-or-later"
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
codegen-units = 1
strip = true
lto = true

[dependencies]
config = "0.15.27"
futures-util = "0.3.34"
prometheus = { version = "0.14.0", features = ["process"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
warp = { version = "0.4.3", features = ["server", "websocket"] }
